# 生成用コンテナからのCONNECTを、許可リストのドメイン・443番だけに限る。
# TLS の中身は復号しない（宛先ドメインだけで判断する）。キャッシュはしない。
http_port 3128

# entrypointが検証した専用ネットワークの範囲だけから受け付ける。
acl codex_net src __SITEOFFER_EGRESS_CLIENT_CIDR__
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !codex_net
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
via off
forwarded_for delete
