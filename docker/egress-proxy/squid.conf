# 生成用コンテナからの送信を、許可リストのドメインへの HTTPS（CONNECT 443）だけに限る（案・未検証）。
# TLS の中身は復号しない（宛先ドメインだけで判断する）。キャッシュはしない。
http_port 3128

# 生成用ネットワーク（docker/compose.codex.yaml の siteoffer-codex-egress）からの接続だけを受ける
acl codex_net src 172.30.240.0/24
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !codex_net
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
via off
forwarded_for delete
